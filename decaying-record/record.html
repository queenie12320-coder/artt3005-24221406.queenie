<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Record Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 text-slate-800">

  <!-- Toast Notification Container -->
  <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-5 py-3 rounded-full text-sm font-medium shadow-lg opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2 z-50 transform -translate-y-2">
    <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
    </svg>
    <span>Item successfully archived!</span>
  </div>

  <!-- Record Card (460px x 520px target size) -->
  <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-200/60 w-full max-w-[460px] h-[520px] p-6 flex flex-col justify-between transition-all duration-300 hover:shadow-2xl hover:shadow-slate-200/80">
    
    <!-- Top & Middle Content Group -->
    <div class="flex flex-col gap-5">
      
      <!-- Image Placeholder -->
      <div class="w-full h-60 bg-gradient-to-br from-slate-100 via-slate-50 to-slate-200 rounded-xl border border-slate-200/80 flex flex-col items-center justify-center gap-3 group cursor-pointer overflow-hidden relative transition-all">
        <div class="p-4 rounded-full bg-white shadow-sm border border-slate-100 text-slate-400 group-hover:scale-110 group-hover:text-slate-600 transition-all duration-300">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 002-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
        </div>
        <span class="text-xs font-medium tracking-wide text-slate-400 uppercase group-hover:text-slate-500 transition-colors">
          Image Placeholder
        </span>
      </div>

      <!-- Title & Subtitle -->
      <div class="space-y-1.5 px-1">
        <h2 class="text-xl font-bold text-slate-900 tracking-tight leading-snug">
          Standard Record Item #204
        </h2>
        <p class="text-xs text-slate-500 font-normal leading-relaxed">
          Last modified on Oct 24, 2026 • 2.4 MB • Public Access
        </p>
      </div>

    </div>

    <!-- Action Button -->
    <button id="archiveBtn" onclick="archiveRecord()" class="w-full py-3.5 px-4 bg-slate-900 hover:bg-slate-800 active:scale-[0.99] text-white text-sm font-semibold rounded-xl shadow-md transition-all duration-200 flex items-center justify-center gap-2 group">
      <svg class="w-4 h-4 text-slate-400 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 01-2-2V5a2 2 0 012-2h14a2 2 0 012 2v1a2 2 0 01-2 2M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path>
      </svg>
      <span id="btnText">Archive this</span>
    </button>

  </div>

  <script>
    let isArchived = false;

    function archiveRecord() {
      const btn = document.getElementById('archiveBtn');
      const btnText = document.getElementById('btnText');
      const toast = document.getElementById('toast');

      if (!isArchived) {
        // Switch state to Archived
        isArchived = true;
        btn.classList.remove('bg-slate-900', 'hover:bg-slate-800');
        btn.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
        btnText.innerText = 'Archived';

        // Show Toast
        toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
        toast.classList.add('opacity-100', 'translate-y-0');

        setTimeout(() => {
          toast.classList.remove('opacity-100', 'translate-y-0');
          toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
        }, 2500);
      } else {
        // Toggle back if clicked again
        isArchived = false;
        btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
        btn.classList.add('bg-slate-900', 'hover:bg-slate-800');
        btnText.innerText = 'Archive this';
      }
    }
  </script>
</body>
</html>
